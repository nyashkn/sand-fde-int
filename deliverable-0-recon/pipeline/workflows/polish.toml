_version = 1

[workflow]
graph = "polish.fabro"

[run]
goal = "Subtractive readability pass on the the target artifact: CSS/layout only, no content changes, preserve all 45 source links, VLM-verified until verdict >= acceptable."
working_dir = "/ABSOLUTE/PATH/TO/your-recon-workspace"

[run.model]
name = "deepseek-v4-flash"

[run.environment]
id = "local-host"

[environments.local-host]
provider = "local"

[run.clone]
enabled = false

[run.artifacts]
include = ["out/architecture.html", "out/review/latest.md", "out/render/latest.png"]
